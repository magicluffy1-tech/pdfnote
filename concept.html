function md(u){let r='# 개념도 점검용 · 중학교 '+u.g+'학년 · '+u.t+'\n\n> 교과서·지도서를 근거로 각 줄을 점검해 주세요. 출처: 시트 = 교사가 정리한 시트 / AI = AI가 추가(교과서 확인 필요)\n\n## 개념 목록\n| 번호 | 개념 | 설명 | 쪽수 | 출처 |\n|---|---|---|---|---|\n';
 const id={};u.nodes.forEach((n,i)=>{id[n.n]='C'+(i+1);r+='| C'+(i+1)+' | '+n.n+' | '+(n.d||'-')+' | '+(n.p||'-')+' | '+n.s+(n.c?'·확인필요':'')+' |\n'});
 r+='\n## 관계 목록 (위에서 아래로 읽는다: 개념 A → 개념 B)\n| 번호 | 개념 A | 관계 | 개념 B | 출처 |\n|---|---|---|---|---|\n';
 u.edges.forEach((e,i)=>{r+='| R'+(i+1)+' | '+e.a+' | '+e.r+' | '+e.b+' | '+e.s+(e.c?'·확인필요':'')+' |\n'});return r}
function dl(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/markdown;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
document.getElementById('dlU').onclick=()=>dl('점검용_중'+cur.g+'_'+cur.t.replace(/[^\w가-힣Ⅰ-Ⅹ]+/g,'')+'.md',md(cur));
document.getElementById('dlA').onclick=()=>dl('점검용_중'+cur.g+'학년_전체.md',D.filter(u=>u.g===cur.g).map(md).join('\n\n---\n\n'));
function grade(g){const T=document.getElementById('tabs');if(T.dataset.g==g)return;T.dataset.g=g;T.innerHTML='';
 document.querySelectorAll('#gs button').forEach(b=>b.classList.toggle('on',+b.dataset.g===g));
 D.filter(u=>u.g===g).forEach(u=>{const b=document.createElement('button');b.textContent=u.t;b.dataset.id=u.id;b.onclick=()=>show(u.id);T.appendChild(b)})}
[1,2,3].forEach(g=>{const b=document.createElement('button');b.textContent=g+'학년';b.dataset.g=g;b.onclick=()=>show(D.find(u=>u.g===g).id);document.getElementById('gs').appendChild(b)});
show(D[0].id);
</script></body></html>
